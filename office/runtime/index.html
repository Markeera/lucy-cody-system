<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lucy Run Office</title><style>
*{box-sizing:border-box}body{background:#211613;color:#ffdec0;font:16px system-ui;margin:0}main{max-width:1672px;margin:auto}nav{display:flex;justify-content:space-between;gap:12px;padding:10px 18px;background:#34241f}a{color:#ffd696} .office{position:relative;width:100%;aspect-ratio:1672/941;container-type:inline-size}.art{display:block;width:100%;height:100%;object-fit:contain}.board{position:absolute;overflow:hidden;font-size:1.05cqw;line-height:1.45;color:#503124}.board h2{font-size:1.25cqw;margin:0 0 .45cqw}.left{left:14.5%;top:16.4%;width:13.8%;height:24.3%}.center{left:32%;top:17.2%;width:39%;height:24%;color:#f9dfbe;text-align:center}.right{left:77.9%;top:17.6%;width:19%;height:23.6%;display:grid;grid-template-rows:repeat(5,1fr);align-items:center}.right div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.right .ready{color:#296342}.right .fail{color:#a32623}.job{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-bottom:1px solid #98634955;margin:.25cqw 0}.job small{font-size:.8cqw}.status{font-size:1.7cqw;margin:.5cqw}.muted{opacity:.7;font-size:.9cqw}.foot{padding:10px 18px;font-size:12px;color:#dec2a8;display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap}.agent-state{position:absolute;top:84.6%;transform:translateX(-50%);background:#34241fe8;color:#ffdfaa;padding:.22cqw .5cqw;border:1px solid #c99a66;font-size:.85cqw;white-space:nowrap}.header-label{position:absolute;left:79%;top:4.7%;width:17%;text-align:center;font-size:1.2cqw;font-weight:bold;color:#ffe0b0}.mobile{display:none}@media(max-width:650px){.mobile{display:block;padding:12px}.mobile div{padding:4px 0}.foot{font-size:11px}}
</style><main><nav><strong>Lucy Run · Office Simulator</strong><a id="dashlink" href="http://127.0.0.1:8765/">Production Dashboard</a></nav><div class="office"><img class="art" src="/approved-office.png" alt="Approved Lucy Run office artwork"><section class="board left"><h2>PROJECT QUEUE</h2><div id="queue"></div></section><section class="board center"><h2>LIVE PRODUCTION MONITOR</h2><div id="task" class="status">Connecting...</div><div id="summary"></div><div id="detail" class="muted"></div></section><section class="board right" id="checks"></section><div class="header-label" id="title">SYSTEM CHECK</div><div class="agent-state" style="left:14%">NO TASK DATA</div><div class="agent-state" style="left:31.7%" id="voice">UNKNOWN</div><div class="agent-state" style="left:50.2%" id="lucy">UNKNOWN</div><div class="agent-state" style="left:69.3%">NO TASK DATA</div><div class="agent-state" style="left:87.4%">NO TASK DATA</div></div><div class="mobile" id="mobile"></div><div class="foot"><span id="stamp">Connecting...</span><span>Live read-only data · no simulated agent activity</span></div></main><script>
if(location.protocol==="https:")document.getElementById("dashlink").href="https://"+location.hostname+"/";
const $=id=>document.getElementById(id);
function el(tag,txt,cls){let x=document.createElement(tag);x.textContent=txt;if(cls)x.className=cls;return x}
async function refresh(){try{const r=await fetch("/api/state",{cache:"no-store"});if(!r.ok)throw Error(r.status);const s=await r.json(),jobs=s.queue.data?.projects||[],state=s.task.data?.state||"unknown";$("queue").replaceChildren();for(const j of jobs.slice(0,5)){let x=el("div",j.id,"job");x.append(document.createElement("br"),el("small",j.status||"unknown"));$("queue").append(x)}$("task").textContent=state.toUpperCase();$("summary").textContent=jobs.length+" projects in dashboard";$("detail").textContent="Agent assignments not instrumented";$("checks").replaceChildren();$("mobile").replaceChildren();for(const [key,label] of [["dashboard","Dashboard"],["n8n","n8n"],["voice","VoiceStudio"],["queue","Project queue"],["task","Task monitor"]]){const ok=s[key]?.online===true;$("checks").append(el("div",label+" · "+(ok?"ONLINE":"OFFLINE"),ok?"ready":"fail"));$("mobile").append(el("div",label+" · "+(ok?"ONLINE":"OFFLINE")))}$("voice").textContent=s.voice.online?"SERVICE READY":"OFFLINE";$("lucy").textContent=state.toUpperCase();$("stamp").textContent="Last update: "+s.checkedAt}catch(e){$("task").textContent="CONNECTION LOST";$("stamp").textContent=String(e);$("queue").replaceChildren();$("checks").replaceChildren();$("voice").textContent=$("lucy").textContent="UNKNOWN"}}refresh();setInterval(refresh,5000);
</script></html>
