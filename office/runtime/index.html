<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lucy Run Office</title><style>
*{box-sizing:border-box}body{background:#151b20;color:#eee2cf;font:16px system-ui;margin:0}main{max-width:1100px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}a{color:#ffd49c}h1{font-size:24px;letter-spacing:2px}.room{position:relative;background:repeating-linear-gradient(0deg,#ae754b 0 18px,#a66a43 18px 20px);border:8px solid #4b302b;overflow:hidden;padding:20px 16px 30px;box-shadow:0 8px 0 #0c1117}.window{height:120px;background:linear-gradient(#63568b,#f59d76,#fbd19c);border:8px solid #50362d;position:relative;overflow:hidden;margin:0 auto 24px;width:75%}.window:before{content:"";position:absolute;bottom:0;width:100%;height:54%;background:repeating-linear-gradient(90deg,#463c57 0 25px,#725064 25px 36px,#38384d 36px 62px);clip-path:polygon(0 40%,12% 40%,12% 0,24% 0,24% 60%,36% 60%,36% 15%,55% 15%,55% 55%,72% 55%,72% 0,84% 0,84% 35%,100% 35%,100% 100%,0 100%)}.staff{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;position:relative}.agent{text-align:center;min-width:0}.sprite{width:72px;height:88px;image-rendering:pixelated;display:block;margin:auto}.desk{background:#70432f;border-top:12px solid #d4a16b;border-bottom:8px solid #432b24;height:62px;margin-top:-8px;display:flex;justify-content:space-around;align-items:center}.monitor{height:34px;width:50px;background:#253740;border:4px solid #392e2b;box-shadow:0 4px #302520;color:#a7dbc0;font:9px monospace;display:grid;place-items:center}.name{font-size:12px;color:white;font-weight:bold;text-shadow:1px 2px #302520}.label{font:11px monospace;background:#302c2a;padding:4px;display:inline-block}.services{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.chip{background:#242f36;padding:8px 12px;border-radius:5px}.ok{color:#a3e8bc}.bad{color:#ffbd99}.panel{background:#222c33;padding:18px;margin-top:16px;border:1px solid #48515a}.row{padding:10px 0;border-bottom:1px solid #48515a;display:flex;justify-content:space-between;gap:8px;word-break:break-word}small{color:#b6b9b5}.cat{font-size:24px;position:absolute;bottom:4px;right:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:600px){main{padding:12px}.sprite{width:44px;height:60px}.monitor{width:34px}.grid{grid-template-columns:1fr}.name{font-size:10px}.label{font-size:9px}.window{height:85px}}
</style><main><header><h1>LUCY RUN <small>OFFICE / LIVE</small></h1><a href="http://127.0.0.1:8765/">Production Dashboard</a></header><div class="room"><div class="window"></div><div class="staff" id="staff"></div><div class="desk" id="desk"></div><div class="cat">🐈</div></div><div class="services" id="services"></div><div class="grid"><section class="panel"><h2>Project queue</h2><div id="queue"></div></section><section class="panel"><h2>Pipeline monitor</h2><div id="pipeline"></div><p><small>Read-only live bridge. Agent assignments are not inferred from service availability. No simulated execution.</small></p></section></div><p id="stamp"></p></main><script>
const agents=[["Script","#49332a","#678fa3"],["Voice","#d778a1","#b15b87"],["Lucy","#392a28","#e9cbb0"],["Visual","#674b36","#537a65"],["Editing","#8e8b80","#536474"]];
const svg=(i,hair,shirt)=>'<svg class="sprite" viewBox="0 0 24 30" shape-rendering="crispEdges"><path fill="#382a2b" d="M6 2h12v2h3v12H3V4h3z"/><path fill="'+hair+'" d="M6 3h12v2h2v8h-3V8H7v5H4V5h2z"/><path fill="#f4c49e" d="M6 9h12v8H6z"/><path fill="#372e2e" d="M8 12h2v2H8zM14 12h2v2h-2z"/>'+([0,4].includes(i)?'<path fill="none" stroke="#2d292a" d="M7 11h4v4H7zM13 11h4v4h-4zM11 12h2"/>':'')+(i===1?'<path fill="none" stroke="#4e394d" stroke-width="2" d="M4 14V8q8-8 16 0v6"/>':'')+'<path fill="'+shirt+'" d="M5 18h14v9H5z"/><path fill="#f4c49e" d="M3 20h3v6H3zM18 20h3v6h-3z"/><path fill="#3d3435" d="M6 27h5v3H6zM13 27h5v3h-5z"/></svg>';
agents.forEach(([n,h,s],i)=>{let d=document.createElement("div");d.className="agent";d.innerHTML=svg(i,h,s)+'<div class="name">'+n+'</div><span class="label" id="a'+i+'">NO TASK DATA</span>';staff.append(d);let m=document.createElement("div");m.className="monitor";m.id="m"+i;m.textContent="---";desk.append(m)});
function row(parent,a,b){let d=document.createElement("div");d.className="row";let x=document.createElement("span"),y=document.createElement("small");x.textContent=a;y.textContent=b;d.append(x,y);parent.append(d)}
async function refresh(){try{let r=await fetch("/api/state",{cache:"no-store"});if(!r.ok)throw Error(r.status);let s=await r.json();services.replaceChildren();for(let k of ["dashboard","n8n","voice","queue","task"]){let c=document.createElement("span");c.className="chip "+(s[k].online?"ok":"bad");c.textContent=k.toUpperCase()+" "+(s[k].online?"ONLINE":"OFFLINE");services.append(c)}queue.replaceChildren();for(let j of s.queue.data?.projects||[])row(queue,j.id,j.status||"unknown");pipeline.replaceChildren();row(pipeline,"n8n health",s.n8n.online?"reachable":"unavailable");row(pipeline,"Dashboard task",s.task.data?.state||"unknown");row(pipeline,"Engine readiness",s.engine.data?.status||"unknown");row(pipeline,"VoiceStudio",s.voice.online?"reachable":"unavailable");row(pipeline,"Agent execution","not instrumented");for(let i=0;i<5;i++)document.getElementById("m"+i).textContent=i===1?(s.voice.online?"VOICE OK":"OFFLINE"):i===2?(s.task.data?.state||"UNKNOWN").toUpperCase():"NO TASK";stamp.textContent="Last live update: "+s.checkedAt}catch(e){stamp.textContent="Live connection failed: "+e;services.replaceChildren();queue.replaceChildren();pipeline.replaceChildren();for(let i=0;i<5;i++)document.getElementById("m"+i).textContent="UNKNOWN"}}refresh();setInterval(refresh,5000);
</script></html>
