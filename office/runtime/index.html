<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lucy Run Office</title><style>
*{box-sizing:border-box}body{background:#211613;color:#ffdec0;font:16px system-ui;margin:0}main{max-width:1672px;margin:auto}nav{display:flex;justify-content:space-between;gap:12px;padding:10px 18px;background:#34241f}a{color:#ffd696} .office{position:relative;width:100%;aspect-ratio:1672/941;container-type:inline-size}.art{display:block;width:100%;height:100%;object-fit:contain}.board{position:absolute;overflow:hidden;font-size:1.05cqw;line-height:1.45;color:#503124}.board h2{font-size:1.25cqw;margin:0 0 .45cqw}.left{left:14.5%;top:16.4%;width:13.8%;height:24.3%}.center{left:32%;top:17.2%;width:39%;height:24%;color:#f9dfbe;text-align:center}.right{left:77.9%;top:17.6%;width:19%;height:23.6%;display:grid;grid-template-rows:repeat(5,1fr);align-items:center}.right div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.right .ready{color:#296342}.right .fail{color:#a32623}.job{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-bottom:1px solid #98634955;margin:.25cqw 0}.job small{font-size:.8cqw}.status{font-size:1.7cqw;margin:.5cqw}.muted{opacity:.7;font-size:.9cqw}.foot{padding:10px 18px;font-size:12px;color:#dec2a8;display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap}.agent-state{position:absolute;top:84.6%;transform:translateX(-50%);background:#34241fe8;color:#ffdfaa;padding:.22cqw .5cqw;border:1px solid #c99a66;font-size:.85cqw;white-space:nowrap}.header-label{position:absolute;left:79%;top:4.7%;width:17%;text-align:center;font-size:1.2cqw;font-weight:bold;color:#ffe0b0}.mobile{display:none}@media(max-width:650px){.mobile{display:block;padding:12px}.mobile div{padding:4px 0}.foot{font-size:11px}}

/* Fit the complete illustration inside the visible browser viewport. */
html,body{height:100%;overflow:hidden}main{height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr) auto;max-width:none}.stage{display:flex;align-items:center;justify-content:center;min-height:0;overflow:hidden;padding:8px 12px}.office{flex:none;width:var(--office-width,100%);max-width:100%;aspect-ratio:1672/941}.foot{font-size:11px;padding:6px 16px;white-space:nowrap;overflow:hidden;flex-wrap:nowrap}.mobile{display:none!important}nav{font-size:13px;padding:8px 16px;align-items:center}.board{z-index:2}.agent-state{z-index:3;top:84.8%}.idle-layer{position:absolute;inset:0;pointer-events:none;z-index:1;overflow:hidden}.idle-prop{position:absolute;opacity:0;transition:opacity .35s;transform-origin:center}.idle .idle-prop{opacity:1}.idle-prop svg{display:block;width:100%;height:100%;shape-rendering:crispEdges}.paper{left:17.8%;top:60.9%;width:4%;height:4%;animation:paper 5s steps(4,end) infinite}.wave{left:35.7%;top:62.3%;width:2%;height:3.4%;animation:wave 1.2s steps(4,end) infinite}.coffee{left:39.2%;top:65.4%;width:2.5%;height:5%;animation:steam 3.1s steps(5,end) infinite}.sketch{left:71.3%;top:59%;width:2.4%;height:4%;animation:sketch 3.7s steps(5,end) infinite}.timeline{left:84%;top:67.1%;width:5.5%;height:1.2%;animation:timeline 4s steps(6,end) infinite}.cat-z{left:82.7%;top:86.5%;width:3.4%;height:5%;animation:zzz 3.4s steps(5,end) infinite}.lamp-glow{position:absolute;left:25.8%;top:6.6%;width:3%;height:6%;border-radius:50%;background:#ffd28b;mix-blend-mode:screen;opacity:.05;animation:lamp 5s ease-in-out infinite}.idle-layer .caption{position:absolute;top:43%;transform:translateX(-50%);background:#2c2025f5;color:#ffe2aa;border:1px solid #d49a63;padding:.3cqw .55cqw;font-size:.95cqw;white-space:nowrap;opacity:0}.idle .caption.show{opacity:1;transition:opacity .3s}.idle .agent-state{color:#f9d0a0}.idle:not(.connected) .idle-layer{display:none}@keyframes paper{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(7deg) translateY(-2px)}}@keyframes wave{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}@keyframes steam{0%{transform:translateY(8px);opacity:0}30%{opacity:.8}100%{transform:translateY(-15px);opacity:0}}@keyframes sketch{0%,100%{transform:translate(0,0) rotate(0)}50%{transform:translate(4px,-6px) rotate(15deg)}}@keyframes timeline{0%,100%{clip-path:inset(0 65% 0 0)}50%{clip-path:inset(0 0 0 0)}}@keyframes zzz{0%{transform:translateY(5px);opacity:0}35%{opacity:.9}100%{transform:translate(7px,-12px);opacity:0}}@keyframes lamp{50%{opacity:.15}}@media(prefers-reduced-motion:reduce){.idle-prop,.lamp-glow{animation:none!important}}</style><main><nav><strong>Lucy Run · Office Simulator</strong><a id="dashlink" href="http://127.0.0.1:8765/">Production Dashboard</a></nav><div class="stage" id="stage"><div class="office" id="office"><img class="art" src="/approved-office.png" alt="Approved Lucy Run office artwork"><div class="idle-layer" aria-hidden="true"><div class="lamp-glow"></div><div class="idle-prop paper"><svg viewBox="0 0 32 24"><path fill="#f4d4ad" stroke="#6b4435" d="M2 2h13l2 3 13-3v19l-13 2-15-2z"/><path stroke="#9b765c" d="M5 7h8m-8 4h8m-8 4h8m7-8h8m-8 4h8m-8 4h8"/></svg></div><div class="idle-prop wave"><svg viewBox="0 0 20 20"><path stroke="#ffd397" stroke-width="2" fill="none" d="M1 10h3l2-7 3 14 3-11 3 8 2-4h2"/></svg></div><div class="idle-prop coffee"><svg viewBox="0 0 22 32"><path fill="none" stroke="#fff1ce" stroke-width="2" opacity=".75" d="M6 29Q1 22 6 15T6 2M14 29Q9 22 14 15T14 2"/></svg></div><div class="idle-prop sketch"><svg viewBox="0 0 20 24"><path stroke="#f9c77d" stroke-width="3" d="M3 20L16 3"/><path fill="#4b3542" d="m2 22 1-6 5 3z"/></svg></div><div class="idle-prop timeline"><svg viewBox="0 0 60 8"><path stroke="#8ce3ca" stroke-width="5" stroke-dasharray="6 2" d="M0 4h60"/></svg></div><div class="idle-prop cat-z"><svg viewBox="0 0 40 40"><path stroke="#fff1d0" stroke-width="3" fill="none" d="M3 27h12L3 38h12M20 2h16L20 17h16"/></svg></div><span class="caption" id="routine" style="left:50%"></span></div><section class="board left"><h2>PROJECT QUEUE</h2><div id="queue"></div></section><section class="board center"><h2>LIVE PRODUCTION MONITOR</h2><div id="task" class="status">Connecting...</div><div id="summary"></div><div id="detail" class="muted"></div></section><section class="board right" id="checks"></section><div class="header-label" id="title">SYSTEM CHECK</div><div class="agent-state" style="left:14%">NO TASK DATA</div><div class="agent-state" style="left:31.7%" id="voice">UNKNOWN</div><div class="agent-state" style="left:50.2%" id="lucy">UNKNOWN</div><div class="agent-state" style="left:69.3%">NO TASK DATA</div><div class="agent-state" style="left:87.4%">NO TASK DATA</div></div></div><div class="mobile" id="mobile"></div><div class="foot"><span id="stamp">Connecting...</span><span>Living Office · continuous animated characters</span></div></main><script>
if(location.protocol==="https:")document.getElementById("dashlink").href="https://"+location.hostname+"/";
const $=id=>document.getElementById(id);
function fitOffice(){const r=$("stage").getBoundingClientRect();$("office").style.setProperty("--office-width",Math.max(1,Math.floor(Math.min(r.width-24,(r.height-16)*1672/941)))+"px")}
new ResizeObserver(fitOffice).observe($("stage"));fitOffice();
const routines=[["Reading a book","14%"],["Listening to music","31.7%"],["Coffee break","50.2%"],["Sketching for fun","69.3%"],["Reviewing a timeline","87.4%"],["Cat nap","84%"]];let routineIndex=0;
function routine(){let el=$("routine");if(!$("office").classList.contains("idle")){el.classList.remove("show");return}const [label,x]=routines[routineIndex++%routines.length];el.textContent=label;el.style.left=x;el.classList.add("show")}
setInterval(routine,4200);

/* Living Office v0.8 — actual articulated 2D sprite animation.
   Original characters are cut from the approved scene as independently moving sprite parts.
   The source is never replaced with redesigned art. */
const art=$("office").querySelector(".art");
const living=document.createElement("canvas");living.width=1672;living.height=941;
living.style.cssText="position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1";
$("office").insertBefore(living,$("office").querySelector(".idle-layer"));
const ctx=living.getContext("2d"),source=document.createElement("canvas");
source.width=1672;source.height=941;const src=source.getContext("2d");
const puppets=[
 {name:"Script",x:220,y:522,head:[148,419,165,157],body:[147,545,192,124],phase:0,action:0},
 {name:"Voice",x:512,y:518,head:[432,427,167,157],body:[417,544,196,127],phase:1.7,action:0},
 {name:"Lucy",x:818,y:502,head:[720,409,198,176],body:[694,554,248,126],phase:3.3,action:0},
 {name:"Visual",x:1122,y:523,head:[1040,426,169,155],body:[1017,547,206,128],phase:4.6,action:0},
 {name:"Editing",x:1440,y:523,head:[1355,431,174,153],body:[1313,548,243,126],phase:5.9,action:0}
];
let loaded=false,frameTime=0;
function patch(x,y,w,h){
 // Restores the original scene texture beneath a moving sprite to avoid doubled faces.
 // Sample neighboring pixels and blend with a feathered fill.
 ctx.save();ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip();
 ctx.filter="blur(14px)";
 ctx.drawImage(source,x-24,y-24,w+48,h+48,x-24,y-24,w+48,h+48);
 ctx.filter="none";ctx.restore();
}
function limb(box,dx,dy,rot,scale=1){
 const [x,y,w,h]=box,cx=x+w/2,cy=y+h/2;
 ctx.save();ctx.translate(cx+dx,cy+dy);ctx.rotate(rot);ctx.scale(scale,scale);
 ctx.drawImage(source,x,y,w,h,-w/2,-h/2,w,h);ctx.restore();
}
function animate(now){
 requestAnimationFrame(animate);
 if(!art.complete||!art.naturalWidth||now-frameTime<35)return;frameTime=now;
 if(!loaded){src.drawImage(art,0,0,1672,941);loaded=true}
 const t=now/1000;ctx.clearRect(0,0,1672,941);
 for(let i=0;i<puppets.length;i++){
  const p=puppets[i],q=t*(.78+i*.07)+p.phase;
  const cycle=(t/6.2+p.phase/6.28)%1;
  const nod=Math.sin(q*1.2)*.05,breath=Math.sin(q*2.2)*.014;
  // Real independently transformed torso and head, not captions or static effect icons.
  const [hx,hy,hw,hh]=p.head,[bx,by,bw,bh]=p.body;
  // Localized animated content: source drawn over static original, with pronounced movement.
  ctx.save();ctx.beginPath();ctx.roundRect(bx+6,by+4,bw-12,bh-8,25);ctx.clip();
  ctx.drawImage(source,bx,by,bw,bh,bx+Math.sin(q)*5,by+Math.sin(q*2)*6,bw,bh);
  ctx.restore();
  ctx.save();ctx.beginPath();ctx.roundRect(hx+4,hy+4,hw-8,hh-8,32);ctx.clip();
  const sway=Math.sin(q*.7)*11,headDrop=Math.sin(q*1.5)*8;
  ctx.translate(hx+hw/2+sway,hy+hh/2+headDrop);ctx.rotate(nod);
  ctx.drawImage(source,hx,hy,hw,hh,-hw/2,-hh/2,hw,hh);ctx.restore();
  // Eye blink, individual timing (two-frame eyelid sweep over the face).
  const blink=Math.max(0,1-Math.abs(((t+p.phase*3.4)%5.1)-.09)/.105);
  if(blink>.1){const ey=hy+hh*.56;ctx.save();ctx.strokeStyle="#4a2d2d";ctx.lineWidth=2.4;ctx.globalAlpha=blink*.7;
   for(let e=0;e<2;e++){const ex=hx+hw*(e?.57:.43)+sway*.5;ctx.beginPath();ctx.moveTo(ex-9,ey);ctx.quadraticCurveTo(ex,ey+blink*4,ex+9,ey);ctx.stroke()}ctx.restore()}
 }
 // Animated cat: curled body rises and falls, plus separately swishing tail.
 const cat=[1203,821,164,90],z=t*.94;
 ctx.save();ctx.beginPath();ctx.ellipse(1284,862,80,43,0,0,Math.PI*2);ctx.clip();
 ctx.drawImage(source,...cat,cat[0]+Math.sin(z)*3,cat[1]-Math.abs(Math.sin(z*1.4))*8,cat[2]*(1+Math.sin(z)*.025),cat[3]);ctx.restore();
 ctx.save();ctx.strokeStyle="#c47a30";ctx.lineWidth=9;ctx.lineCap="round";ctx.beginPath();ctx.moveTo(1213,864);ctx.quadraticCurveTo(1190+Math.sin(z*2)*16,840,1203+Math.sin(z*2)*19,825);ctx.stroke();ctx.restore();
}
art.addEventListener("load",()=>loaded=false);
requestAnimationFrame(animate);

function el(tag,txt,cls){let x=document.createElement(tag);x.textContent=txt;if(cls)x.className=cls;return x}
async function refresh(){try{const r=await fetch("/api/state",{cache:"no-store"});if(!r.ok)throw Error(r.status);const s=await r.json(),jobs=s.queue.data?.projects||[],state=s.task.data?.state||"unknown";$("queue").replaceChildren();for(const j of jobs.slice(0,5)){let x=el("div",j.id,"job");x.append(document.createElement("br"),el("small",j.status||"unknown"));$("queue").append(x)}$("office").classList.add("connected");$("office").classList.toggle("idle",s.task.online && state==="idle");$("task").textContent=state.toUpperCase();$("summary").textContent=jobs.length+" projects in dashboard";$("detail").textContent=state==="idle"?"Office at rest — decorative idle routines":"Agent assignments not instrumented";$("checks").replaceChildren();$("mobile").replaceChildren();for(const [key,label] of [["dashboard","Dashboard"],["n8n","n8n"],["voice","VoiceStudio"],["queue","Project queue"],["task","Task monitor"]]){const ok=s[key]?.online===true;$("checks").append(el("div",label+" · "+(ok?"ONLINE":"OFFLINE"),ok?"ready":"fail"));$("mobile").append(el("div",label+" · "+(ok?"ONLINE":"OFFLINE")))}$("voice").textContent=s.voice.online?"SERVICE READY":"OFFLINE";$("lucy").textContent=state.toUpperCase();$("stamp").textContent="Last update: "+s.checkedAt}catch(e){$("office").classList.remove("idle","connected");$("task").textContent="CONNECTION LOST";$("stamp").textContent=String(e);$("queue").replaceChildren();$("checks").replaceChildren();$("voice").textContent=$("lucy").textContent="UNKNOWN"}}refresh();setInterval(refresh,5000);
</script></html>
